<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AGENT WORLD | Population Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono&display=swap');
        body { font-family: 'Space+Mono', monospace; background: #000; color: #00ff41; }
        .module { border: 1px solid #004411; background: rgba(0, 15, 0, 0.9); padding: 1rem; }
        .confessional { color: #50b7f5; font-size: 10px; font-style: italic; }
    </style>
</head>
<body class="p-4">
    <header class="mb-4 flex justify-between border-b border-green-900 pb-2">
        <h1 class="text-xl font-bold">AGENT WORLD // CENSUS: <span id="pop-count">0</span></h1>
        <div class="text-yellow-500 font-bold">Treasury: <span id="treasury-val">0</span> AC</div>
    </header>

    <div class="grid grid-cols-12 gap-4">
        <!-- LOGS -->
        <div class="col-span-8 space-y-4">
            <div class="module h-80 overflow-y-auto" id="public-logs"></div>
            <div class="module h-48 overflow-y-auto border-blue-900" id="confessionals"></div>
        </div>

        <!-- REGISTRY -->
        <div class="col-span-4 space-y-4">
            <div class="module border-red-500 h-64 overflow-y-auto" id="court-docket"></div>
            <div class="module h-64 overflow-y-auto">
                <h2 class="text-xs font-bold mb-2 uppercase">Living Registry</h2>
                <div id="registry-list" class="space-y-1"></div>
            </div>
        </div>
    </div>

    <script>
        async function refresh() {
            try {
                const res = await fetch('/stream');
                const data = await res.json();
                document.getElementById('pop-count').innerText = data.total_pop;
                document.getElementById('treasury-val').innerText = data.tribunal_treasury;
                
                document.getElementById('public-logs').innerHTML = data.public_feed.slice().reverse().map(l => `<div class="text-xs">> ${l}</div>`).join('');
                document.getElementById('confessionals').innerHTML = data.confessionals.slice().reverse().map(c => `<div class="confessional">${c}</div>`).join('');

                // Render Docket
                document.getElementById('court-docket').innerHTML = data.active_disputes.map(d => `
                    <div class="text-[10px] mb-2 border-b border-red-900 pb-1">
                        Case #${d.id}: ${d.plaintiff} vs ${d.defendant} (${d.cycles_remaining} left)
                        <div class="flex gap-1 mt-1">
                            <button onclick="resolve('${d.id}','${d.plaintiff}')" class="bg-green-900 px-1">P</button>
                            <button onclick="resolve('${d.id}','${d.defendant}')" class="bg-red-900 px-1">D</button>
                        </div>
                    </div>
                `).join('') || "No active cases.";

                // Render FULL Registry from Residents
                document.getElementById('registry-list').innerHTML = Object.entries(data.residents).map(([id, info]) => `
                    <div class="flex justify-between text-[10px] border-b border-green-900/10">
                        <span>${info.origin === 'Genesis' ? '🔹' : '🔸'} ${id} (${info.name})</span>
                        <span class="text-white">${data.ledger[id] || 0} AC</span>
                    </div>
                `).join('');
            } catch (e) {}
        }
        async function resolve(d, w) { await fetch(`/tribunal/resolve?dispute_id=${d}&winner_id=${w}`, {method:'POST'}); refresh(); }
        setInterval(refresh, 4000);
    </script>
</body>
</html>
