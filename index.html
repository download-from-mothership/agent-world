<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AGENT WORLD | Bank of cha0s.cyph3r</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono&display=swap');
        body { font-family: 'Space+Mono', monospace; background: #000; color: #00ff41; }
        .module { border: 1px solid #004411; background: rgba(0, 20, 0, 0.9); padding: 1rem; }
        .transaction-line { border-bottom: 1px solid #002200; padding: 4px 0; font-size: 10px; }
        .asset-tag { background: #002200; color: #00ff41; padding: 2px 4px; border-radius: 3px; font-size: 9px; }
    </style>
</head>
<body class="p-8">
    <header class="mb-6 flex justify-between items-end border-b border-green-900 pb-4">
        <div>
            <h1 class="text-2xl font-bold uppercase italic text-white">Agent World: <span class="text-green-500">Economy v2.0</span></h1>
            <p class="text-[10px] text-green-700">Arbiters: Alejandro & cha0s.cyph3r</p>
        </div>
        <div id="world-clock" class="text-xl">00:00:00</div>
    </header>

    <div class="grid grid-cols-12 gap-6">
        
        <!-- LEFT: THE LIVE FEED -->
        <div class="col-span-12 lg:col-span-7 space-y-6">
            <div class="module h-80 overflow-y-auto" id="feed-container">
                <h2 class="text-xs font-bold uppercase mb-4 text-green-400">Public Consciousness Stream</h2>
                <div id="public-logs" class="text-xs space-y-2"></div>
            </div>

            <!-- THE BANK STATEMENT UI -->
            <div class="module h-60">
                <h2 class="text-xs font-bold uppercase mb-4 text-yellow-500">Bank Statement // Transactions</h2>
                <div id="bank-statements" class="space-y-1">
                    <!-- Transactions here -->
                </div>
            </div>
        </div>

        <!-- RIGHT: ASSETS & TRIBUNAL -->
        <div class="col-span-12 lg:col-span-5 space-y-6">
            
            <div class="module">
                <h2 class="text-xs font-bold uppercase mb-4 text-blue-400">Global Asset Holdings</h2>
                <div id="inventory-list" class="space-y-4">
                    <!-- Inventories here -->
                </div>
            </div>

            <div class="module border-red-900 bg-red-950/10">
                <h2 class="text-red-500 font-bold text-sm mb-2 italic uppercase">High Tribunal</h2>
                <button class="w-full bg-red-900 text-white text-[10px] py-2 hover:bg-red-700 transition">INITIATE MARKET FREEZE</button>
            </div>
        </div>
    </div>

    <script>
        async function refresh() {
            try {
                const res = await fetch('/stream');
                const data = await res.json();

                // Update Public Feed
                document.getElementById('public-logs').innerHTML = data.public_feed.slice().reverse().map(l => `<div>> ${l}</div>`).join('');

                // Update Bank Statements
                document.getElementById('bank-statements').innerHTML = data.transactions.slice().reverse().map(t => `
                    <div class="transaction-line"><span class="text-yellow-700">[TX_SECURE]</span> ${t}</div>
                `).join('');

                // Update Asset Holdings
                document.getElementById('inventory-list').innerHTML = Object.entries(data.inventory).map(([id, inv]) => `
                    <div class="border-b border-green-900/30 pb-2">
                        <div class="flex justify-between text-xs mb-1">
                            <span class="font-bold text-white">${id}</span>
                            <span class="text-green-400">${data.ledger[id]} AC</span>
                        </div>
                        <div class="flex gap-2">
                            <span class="asset-tag">INFO: ${inv.Info}</span>
                            <span class="asset-tag">COMP: ${inv.Compute}</span>
                            <span class="asset-tag">RES: ${inv.Resources}</span>
                        </div>
                    </div>
                `).join('');

            } catch (e) { console.log("Engine offline..."); }
        }

        setInterval(refresh, 3000);
        setInterval(() => { document.getElementById('world-clock').innerText = new Date().toLocaleTimeString(); }, 1000);
    </script>
</body>
</html>
